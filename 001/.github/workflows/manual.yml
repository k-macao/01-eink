name: 🐙 章鱼AI · 手动抓取推送

on:
  workflow_dispatch:
    inputs:
      no_push:
        description: "仅生成日报，不推送到微信"
        type: boolean
        default: false
        required: false
      full:
        description: "全量长版：恢复长文、完整表格与方法细节，不生成短线速查卡"
        type: boolean
        default: false
        required: false

# 与「🐙 章鱼AI · 每日自动推送」共用一把锁（详见 octopus-daily.yml 的同名注释）：
# 两个作业生成同一批文件、推同一个分支，并行跑必然有一方推送被拒。
concurrency:
  group: octopus-report
  cancel-in-progress: false

jobs:
  octopus-manual-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt

      - name: 🐙 抓取最新动态数据并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 一对多群组推送（2026-10-23 起默认）：群组编码优先取 Secret PUSHPLUS_TOPIC；
          # Secret 没配时兜底用仓库群组 oai.1（下面这个字面量就是兜底值，换群改这里）。
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC || 'oai.1' }}
          # 推送模式：one2many（默认，一对多群组）/ one2one（一对一 直发自己）。
          PUSHPLUS_MODE: ${{ vars.PUSHPLUS_MODE || 'one2many' }}
          OCTOPUS_MACD: ${{ vars.OCTOPUS_MACD || '1' }}
          OCTOPUS_MACD_SYMBOLS: ${{ vars.OCTOPUS_MACD_SYMBOLS }}
          # ◧ AI 七日港股走势分析概率的大模型 Key：与「每日自动推送」同一套口径
          # （本仓专用名 → 厂商通用名回落，既有的 DEEPSEEK_API_KEY 直接可用）。
          # 手动抓取推送此前完全不传 Key，导致「手动跑出来的日报这一栏永远是缺的」。
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OCTOPUS_LLM_BASE_URL: ${{ vars.OCTOPUS_LLM_BASE_URL }}
          OCTOPUS_LLM_MODEL: ${{ vars.OCTOPUS_LLM_MODEL }}
          OCTOPUS_LLM_MAX_TOKENS: ${{ vars.OCTOPUS_LLM_MAX_TOKENS }}
        run: |
          set -euo pipefail
          NO_PUSH="${{ github.event.inputs.no_push || 'false' }}"
          FULL="${{ github.event.inputs.full || 'false' }}"
          PIPELINE_ARGS=()

          if [ "$FULL" = "true" ]; then
            echo "版面模式：全量长版（恢复长文、表格与方法细节；不出短线速查卡）"
            PIPELINE_ARGS+=(--full)
          else
            echo "版面模式：默认精简版"
          fi

          if [ "$NO_PUSH" = "true" ]; then
            echo "运行模式：仅生成，不推送"
            PIPELINE_ARGS+=(--no-push)
          else
            echo "运行模式：抓取最新数据 → 生成 → 推送"
          fi

          python3 output/pipeline.py "${PIPELINE_ARGS[@]}"

      - name: 📤 提交生成的日报
        if: always()
        run: |
          set -euo pipefail
          # 与定时作业提交同一批文件（含三个留痕 JSON）：手动跑一轮同样会发出预测，
          # 漏提交就等于把这轮的留痕丢掉，命中率统计会缺样本。
          # 提交与推送交给 tools/safe_push.sh（被拒后重放到远端最新提交之上，
          # 留痕 JSON 并集合并、别人的改动不回退），原因见 自动更新推送被拒-原因诊断.md。
          COMMIT_DATE=$(TZ='Asia/Macau' date +%Y-%m-%d)
          bash tools/safe_push.sh \
            --branch "${GITHUB_REF_NAME:-main}" \
            --message "📰 手动抓取推送 ${COMMIT_DATE}" \
            -- output/daily_report_*.html output/latest.html \
               output/sentiment_history.json output/news_history.json \
               output/quant_history.json output/hk7_forecast.json \
               output/weekly_forecast.json

      - name: 🧯 推送失败兜底：把生成物存成 Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-manual-unpushed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/daily_report_*.html
            output/latest.html
            output/sentiment_history.json
            output/news_history.json
            output/quant_history.json
            output/hk7_forecast.json
            output/weekly_forecast.json
          if-no-files-found: ignore
          retention-days: 14
