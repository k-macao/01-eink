name: 🗄️ 市场数据库 · 定时入库（隐藏功能）

# 隐藏功能（2026-10-01 按用户要求）：每天三次把股票行情快照落库到
# output/market_db/YYYYMMDD.json（文件以日期为名字，当天三档写同一个文件），
# 作为 AI 分析 / AI 预测 / AI 模型的基础数据。
#
#   · 单主源 + 备用源待命（已取消多源交叉验证）：
#     主源 Yahoo chart（query1 / query2）优先；仅对主源失败或未覆盖的标的按序切换
#     东方财富 push2 → 腾讯财经 qt → 新浪财经 hq → 通达信 mootdx（沪深）→ 东财 push2his 日K；
#   · 自我检查：主备源可用性 / 标的覆盖 / 数值 / 跨时段与跨日跳变 / 文件哈希。
#
# 防卡死（2026-10-01：一次运行被单台死主站拖到 20 分钟上限取消，日志只剩
# 「未找到配置文件 … / 请手动运行 mootdx bestip / Error: The operation was canceled.」）：
#   · market_db.py 侧四道闸 —— 预置 mootdx 配置、TCP 预检、先行情验活后逐只明细、
#     通达信通道总预算（OCTOPUS_DB_TDX_BUDGET，默认 90s）；
#   · 工作流侧 —— PYTHONUNBUFFERED=1（被 kill 时 stdout 不再整段丢失，日志留证）、
#     采集步骤单独设 8 分钟上限（真卡住就快速失败，不占用整作业的 20 分钟）。
#
# 该功能不进日报正文、不进微信推送、不出现在 pipeline --help 里，与日报的
# 当天检验 / 推送门禁完全解耦。
on:
  schedule:
    # GitHub cron 用 UTC；北京时间 = UTC+8
    - cron: "0 0 * * *"     # 北京 08:00（盘前）
    - cron: "30 4 * * *"    # 北京 12:30（午间）
    - cron: "0 9 * * *"     # 北京 17:00（盘后 / 收盘复核）
  workflow_dispatch:
    inputs:
      slot:
        description: "时段（auto = 按北京时间就近匹配 0800 / 1230 / 1700）"
        type: choice
        options: ["auto", "0800", "1230", "1700"]
        default: "auto"
        required: false
      dry_run:
        description: "只采集与自检，不写库文件"
        type: boolean
        default: false
        required: false
      days:
        description: "stats 回看的日期数"
        type: string
        default: "5"
        required: false

permissions:
  contents: write

concurrency:
  group: market-db
  cancel-in-progress: false

jobs:
  market-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 行缓冲：作业被取消时 stdout 里的采集进度不会整段丢失（2026-10-01 事故复盘发现）
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests
          # 通达信通道（mootdx）：装上就多一路沪深行情 + 日K收盘核对 + 财务 / 除权除息；
          # 装不上或连不上主站时该源标记 unavailable，其余 5 路照常（绝不编数）。
          pip install --quiet mootdx || echo "::warning::mootdx 安装失败，本次跳过通达信通道"

      - name: 🗄️ 单主源采集（备用源待命兜底）→ 自检 → 落库
        timeout-minutes: 8        # 兜底：真卡住就快速失败，别耗满整作业的 20 分钟
        env:
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          OCTOPUS_DB_SYMBOLS: ${{ vars.OCTOPUS_DB_SYMBOLS }}
          # 可选：OCTOPUS_DB_TDX_SERVERS 指定通达信主站（host:port,host:port）
          OCTOPUS_DB_TDX: ${{ vars.OCTOPUS_DB_TDX || '1' }}
          OCTOPUS_DB_TDX_BUDGET: ${{ vars.OCTOPUS_DB_TDX_BUDGET || '90' }}   # 通达信通道总预算（秒）
          # 可选：OCTOPUS_DB_TDX_CONFIG 指定 mootdx 配置文件路径（默认 $HOME/.mootdx/config.json）
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：主源优先采集（备用源待命）+ 自检（不写库文件）"
            python3 output/market_db.py pull --slot "$SLOT" --dry-run
          else
            echo "运行模式：主源优先采集（备用源待命）→ 自检 → 写库"
            python3 output/market_db.py pull --slot "$SLOT"
          fi

      - name: 🔍 复核库文件（哈希 / 覆盖 / 自检）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          python3 output/market_db.py verify --all || echo "::warning::市场数据库复核发现缺陷（见上方日志）"
          python3 output/market_db.py stats --days "${{ github.event.inputs.days || '5' }}"

      - name: 🧠 导出 AI 数据集（供分析与建模；失败不影响落库）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p output/market_db/ai
          python3 output/market_db.py export --out output/market_db/ai/dataset.jsonl --format jsonl \
            || echo "::warning::AI 数据集导出失败（库文件已照常提交）"

      - name: 📦 上传 AI 数据集（不进版本库，按需下载）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-db-ai-dataset
          path: output/market_db/ai/dataset.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: 📤 提交库文件
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          # 日报工作流可能同时在推同一分支：被拒时由 tools/safe_push.sh 把本次改动
          # 重放到远端最新提交之上再推（最多 5 次）。原先这里是一次性的
          # `git pull --rebase --autostash origin HEAD`，有两个毛病：只重试一次，
          # 且一旦 rebase 撞车就把作业留在半截 rebase 状态里、本次落库内容丢失。
          # 库文件自带 sha256 自校验，不做内容级合并：整份以本次为准（哈希才自洽），
          # 同日三档本来就由本作业按先后顺序累加，concurrency 也保证不会自己撞自己。
          COMMIT_TIME=$(TZ='Asia/Macau' date +'%Y-%m-%d %H:%M')
          bash tools/safe_push.sh \
            --branch "${GITHUB_REF_NAME:-main}" \
            --message "🗄️ 市场数据库 ${COMMIT_TIME}" \
            -- output/market_db/
