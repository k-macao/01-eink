<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eMemoLog</title>
	<link rel="stylesheet" href="css/main.css?v=20261025a">
</head>

<body>
    <div class="main">
        <h3>墨水屏日历</h3>
        <fieldset>
            <legend>蓝牙连接</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-connect" type="button" class="primary" onclick="preConnect()">连接</button>
                    <button id="btn-reconnect" type="button" class="secondary" onclick="reConnect()">重连</button>
                    <button id="btn-reselect" type="button" class="secondary" onclick="forceReselect()">重新选择设备</button>
					<button type="button" class="secondary" onclick="clearLog()">清空日志</button>
                </div>
            </div>
            <div id="log"></div>
        </fieldset>
        <fieldset>
            <legend>设备控制</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-synctime" type="button" class="primary" onclick="syncTime(1)">同步时间</button>
                    <button id="btn-rotate" type="button" class="secondary" onclick="rotateScreen()">旋转屏幕</button>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>AI 总结推送</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <label for="sum-size">屏幕尺寸</label>
                    <select id="sum-size" onchange="previewSummary()">
                        <option value="400x300" selected>4.2 寸 400×300</option>
                        <option value="296x128">2.9 寸 296×128</option>
                        <option value="250x122">2.13 寸 250×122</option>
                    </select>
                    <label for="sum-font">字体</label>
                    <select id="sum-font" onchange="previewSummary()">
                        <option value="hei" selected>黑体加粗</option>
                        <option value="song">宋体加粗</option>
                        <option value="kai">楷体加粗</option>
                        <option value="mono">等宽点阵</option>
                    </select>
                    <label for="sum-size-scale">字号</label>
                    <select id="sum-size-scale" onchange="previewSummary()">
                        <option value="small">小（内容优先）</option>
                        <option value="normal" selected>标准</option>
                        <option value="large">大（字大优先）</option>
                    </select>
                    <label for="sum-zoom">预览</label>
                    <select id="sum-zoom" onchange="previewSummary()">
                        <option value="1" selected>1×</option>
                        <option value="2">2×</option>
                        <option value="3">3×</option>
                    </select>
                    <label><input type="checkbox" id="sum-rotate"> 旋转 180°</label>
                    <label><input type="checkbox" id="sum-color"> 三色（黑白红）</label>
                </div>
            </div>
            <div class="flex-container">
                <div class="flex-group">
                    <button type="button" class="secondary" onclick="previewSummary(true)">重新抓取并预览</button>
                    <button id="btn-push-summary" type="button" class="primary" onclick="pushLatestSummary()">推送最新AI总结</button>
                    <button id="btn-push-sample" type="button" class="secondary" onclick="pushFontSample()">推送字体样张</button>
                </div>
            </div>
            <div class="sum-hint">字体不清楚时，先「推送字体样张」到设备上比对，再回来选字号 / 字体。</div>
            <canvas id="sum-preview"
                style="display:none;width:100%;max-width:420px;margin-top:10px;border:1px solid #E4E4E7;image-rendering:pixelated;"></canvas>
            <div id="sum-status" style="margin-top:8px;font-size:0.9rem;color:#666;">尚未生成预览</div>
        </fieldset>
        <fieldset>
            <legend>每天自动蓝牙更新</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <label for="chk-auto-update">启用自动更新</label>
                    <input type="checkbox" id="chk-auto-update" onchange="toggleAutoUpdate()">
                    <label for="time-auto-update">每日执行时间</label>
                    <input type="time" id="time-auto-update" value="08:00" onchange="setAutoUpdateTime()">
                    <button type="button" class="secondary" onclick="testAutoUpdate()">立即测试</button>
                </div>
            </div>
            <div id="auto-status" style="margin-top:8px; font-size:0.9rem; color:#666;">自动更新：已停止</div>
        </fieldset>
    </div>
    <script type="text/javascript" src="js/main.js?v=20261025a"></script>
    <script type="text/javascript" src="js/ai-summary.js?v=20261025a"></script>
</body>

</html>
