<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>章鱼 AI.每日研报</title>
    <link rel="preload" href="fonts/AlibabaPuHuiTi-3-55-Regular.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="css/main.css?v=20261025-columns">
</head>

<body>
    <div class="main">
        <h3>章鱼 AI.每日研报</h3>
        <fieldset>
            <legend>蓝牙连接</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-connect" type="button" class="primary" onclick="preConnect()">连接</button>
                    <button id="btn-reconnect" type="button" class="secondary" onclick="reConnect()">重连</button>
                    <button id="btn-reselect" type="button" class="secondary" onclick="forceReselect()">重新选择设备</button>
					<button type="button" class="secondary" onclick="clearLog()">清空日志</button>
                </div>
            </div>
            <div id="log"></div>
        </fieldset>
        <fieldset>
            <legend>设备控制</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-synctime" type="button" class="primary" onclick="syncTime(1)">同步时间</button>
                    <button id="btn-rotate" type="button" class="secondary" onclick="rotateScreen()">旋转屏幕</button>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>仓库 007 · 每日研报推送</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <label for="sum-size">屏幕尺寸</label>
                    <select id="sum-size" onchange="previewSummary()">
                        <option value="400x300" selected>4.2 寸 400×300</option>
                        <option value="296x128">2.9 寸 296×128</option>
                        <option value="250x122">2.13 寸 250×122</option>
                    </select>
                    <label for="sum-font">字体</label>
                    <select id="sum-font" disabled aria-label="固定字体：阿里巴巴普惠体，常规字重">
                        <option value="puhui" selected>阿里巴巴普惠体（非加粗）</option>
                    </select>
                    <label for="sum-size-scale">字号</label>
                    <select id="sum-size-scale" disabled aria-label="固定字号：13px">
                        <option value="fixed13" selected>13px</option>
                    </select>
                    <label for="sum-zoom">预览</label>
                    <select id="sum-zoom" onchange="previewSummary()">
                        <option value="1" selected>1×</option>
                        <option value="2">2×</option>
                        <option value="3">3×</option>
                    </select>
                    <label><input type="checkbox" id="sum-rotate"> 旋转 180°</label>
                    <label><input type="checkbox" id="sum-color"> 三色（黑白红）</label>
                </div>
            </div>
            <div class="flex-container">
                <div class="flex-group">
                    <button type="button" class="secondary" onclick="previewSummary(true)">重新读取 007 并预览</button>
                    <button id="btn-push-summary" type="button" class="primary" onclick="pushLatestSummary()">推送最新每日研报</button>
                    <button id="btn-push-sample" type="button" class="secondary" onclick="pushFontSample()">推送字体样张</button>
                </div>
            </div>
            <div class="sum-hint">每天澳门时间 09:05 / 17:05 紧跟 007 发布后读取仓库 007；屏上只显示「AI 多空概率、热点话题、风险点、机会点」。固定使用阿里巴巴普惠体、13px、非加粗、紧凑排版；三种屏幕均保留完整四栏。内容多时自动简单压缩（去权重标注 → 完整短句 → 减条数 → 收紧行距）装进一屏，不把句子截断。</div>
            <canvas id="sum-preview"
                style="display:none;width:100%;max-width:420px;margin-top:10px;border:1px solid #E4E4E7;image-rendering:pixelated;"></canvas>
            <div id="sum-status" style="margin-top:8px;font-size:0.9rem;color:#666;">尚未生成预览</div>
        </fieldset>
        <fieldset>
            <legend>每天两次自动显示</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <label for="chk-auto-update">启用自动推送</label>
                    <input type="checkbox" id="chk-auto-update" onchange="toggleAutoUpdate()">
                    <label for="time-auto-update-am">早报</label>
                    <input type="time" id="time-auto-update-am" value="09:15" onchange="setAutoUpdateTimes()">
                    <label for="time-auto-update-pm">晚报</label>
                    <input type="time" id="time-auto-update-pm" value="17:15" onchange="setAutoUpdateTimes()">
                    <button type="button" class="secondary" onclick="testAutoUpdate()">立即测试研报推送</button>
                </div>
            </div>
            <div class="sum-hint">页面需保持打开；先手动选择设备一次，早晚两次会自动重连、同步时间并推送最新研报。</div>
            <div id="auto-status" style="margin-top:8px; font-size:0.9rem; color:#666;">自动推送：已停止</div>
        </fieldset>
    </div>
    <script type="text/javascript" src="js/main.js?v=20261025-columns"></script>
    <script type="text/javascript" src="js/ai-summary.js?v=20261025-columns"></script>
</body>

</html>
