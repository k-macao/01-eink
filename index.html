<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eMemoLog</title>
	<link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="main">
        <h3>墨水屏日历</h3>
        <fieldset>
            <legend>蓝牙连接</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-connect" type="button" class="primary" onclick="preConnect()">连接</button>
                    <button id="btn-reconnect" type="button" class="secondary" onclick="reConnect()">重连</button>
                    <button id="btn-reselect" type="button" class="secondary" onclick="forceReselect()">重新选择设备</button>
					<button type="button" class="secondary" onclick="clearLog()">清空日志</button>
                </div>
            </div>
            <div id="log"></div>
        </fieldset>
        <fieldset>
            <legend>设备控制</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="btn-synctime" type="button" class="primary" onclick="syncTime(1)">同步时间</button>
                    <button id="btn-rotate" type="button" class="secondary" onclick="rotateScreen()">旋转屏幕</button>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>每天自动蓝牙更新</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <label for="chk-auto-update">启用自动更新</label>
                    <input type="checkbox" id="chk-auto-update" onchange="toggleAutoUpdate()">
                    <label for="time-auto-update">每日执行时间</label>
                    <input type="time" id="time-auto-update" value="08:00" onchange="setAutoUpdateTime()">
                    <button type="button" class="secondary" onclick="testAutoUpdate()">立即测试</button>
                </div>
            </div>
            <div id="auto-status" style="margin-top:8px; font-size:0.9rem; color:#666;">自动更新：已停止</div>
        </fieldset>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
